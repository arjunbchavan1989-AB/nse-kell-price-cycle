name: Daily Kell Scan and Pages
on:
  schedule:
    # 19:30 IST. Independent acquisition, with no other dashboard dependency.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Fetch and validate EOD data (disable for a UI-only redeploy)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'web/index.html'
      - '.github/workflows/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kell-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache/restore@v5
        with:
          path: pipeline/cache
          key: kell-own-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: kell-own-market-${{ runner.os }}-
      - name: Install scanner dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch own NSE universe and scan completed EOD prices
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/run.py 2>&1 | tee /tmp/kell-scan.log
      - uses: actions/cache/save@v5
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_data)
        with:
          path: pipeline/cache
          key: kell-own-market-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data snapshots pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated Kell EOD snapshot [skip ci]"
            git push
          fi
      - name: Configure native GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy and verify the public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Attach scan diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scan-log
          path: /tmp/kell-scan.log
          if-no-files-found: ignore
