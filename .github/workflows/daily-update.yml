name: Daily Kell Scan and Pages
on:
  schedule:
    # 20:00 IST, after the existing universe's 19:00 IST refresh.
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'web/index.html'
      - '.github/workflows/**'
permissions:
  contents: write
concurrency:
  group: kell-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: kell-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: kell-history-${{ runner.os }}-
      - name: Install scanner dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan the completed shared-universe session
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/run.py 2>&1 | tee /tmp/kell-scan.log
      - uses: actions/cache/save@v4
        with:
          path: pipeline/cache
          key: kell-history-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data snapshots pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated Kell EOD snapshot [skip ci]"
            git push
          fi
      - name: Publish the dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
      - name: Attach scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-log
          path: /tmp/kell-scan.log
          if-no-files-found: ignore
