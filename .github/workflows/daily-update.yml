name: Daily Kell Scan and Pages
on:
  schedule:
    # 19:30 IST; wait for the Stage workflow's fresh batch before scanning.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Fetch and validate EOD data (disable for a UI-only redeploy)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'tests/**'
      - 'web/index.html'
      - '.github/workflows/**'
permissions:
  contents: write
concurrency:
  group: kell-daily
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/cache/restore@v5
        with:
          path: pipeline/cache
          key: kell-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: kell-history-${{ runner.os }}-
      - name: Install scanner dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Checkout upstream Stage universe
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        uses: actions/checkout@v6
        with:
          repository: arjunbchavan1989-AB/nse-stage-analysis
          path: .upstream
          sparse-checkout: web/data
      - name: Wait for this evening's validated Stage batch
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        run: python pipeline/wait_upstream.py --checkout .upstream
      - name: Scan the completed shared-universe session
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/run.py --source-file .upstream/web/data/latest.json 2>&1 | tee /tmp/kell-scan.log
      - uses: actions/cache/save@v5
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_data
        with:
          path: pipeline/cache
          key: kell-history-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data snapshots pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated Kell EOD snapshot [skip ci]"
            git push
          fi
      - name: Publish the dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
      - name: Attach scan diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scan-log
          path: /tmp/kell-scan.log
          if-no-files-found: ignore
